<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>101Drivers — Not available in your region yet</title>
    <style>
      /* Self-contained by design: this page must render even when every
         other asset of the site is unreachable. No external fonts, no
         images, no JS. Palette mirrors the app (slate + lime). */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card { max-width: 420px; }
      .mark {
        width: 64px; height: 64px; margin: 0 auto 24px;
        border-radius: 18px;
        background: #84cc16;
        display: flex; align-items: center; justify-content: center;
        font-size: 30px; font-weight: 900; color: #ffffff;
        letter-spacing: -1px;
      }
      h1 { font-size: 24px; font-weight: 800; line-height: 1.25; margin-bottom: 12px; }
      p { font-size: 15px; line-height: 1.6; color: #475569; margin-bottom: 8px; }
      .btn {
        display: inline-block; margin-top: 24px;
        padding: 14px 28px; border-radius: 16px;
        background: #84cc16; color: #ffffff;
        font-size: 16px; font-weight: 800; text-decoration: none;
      }
      .footer { margin-top: 32px; font-size: 12px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">101</div>
      <h1>101Drivers isn&rsquo;t available in your region yet</h1>
      <p>We&rsquo;re expanding step by step. If you believe you should be able
         to use 101Drivers here, contact us and we&rsquo;ll sort it out.</p>
      <a class="btn" href="https://wa.me/message/YQXTDFV6STKUP1">Contact us on WhatsApp</a>
      <div class="footer">101Drivers &mdash; vehicle delivery, door to door.</div>
    </div>
  </body>
</html>
