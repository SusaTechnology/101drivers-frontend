    <title>101 Drivers — Car Pickup & Delivery Service in California | Flat Rate</title>

    <meta name="description" content="California's flat-rate car pickup & delivery service. Dealers & individuals get instant quotes, real-time GPS tracking, and insured vehicle transport across Southern California. Santa Monica to LA & beyond." />
    <meta name="keywords" content="car delivery California, vehicle delivery service, car pickup and delivery, dealer vehicle transport, flat rate car delivery, car delivery Los Angeles, vehicle transport Southern California, auto transport California, car shipping LA, dealership car delivery, car moving service, door to door car delivery, Southern California car delivery, LA car transport, Santa Monica car delivery" />

    <!-- ── Geo tags (local SEO for California) ── -->

    <!-- ── PWA Meta Tags ── -->
    <meta name="application-name" content="101 Drivers" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="101 Drivers" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Theme Colors -->
    <meta name="theme-color" content="#a3e635" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="msapplication-TileColor" content="#a3e635" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72x72.png" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />

    <!-- ── SEO: Open Graph + Twitter Card + Canonical ──
         These power social sharing previews (Facebook, X, LinkedIn,
         Slack, Discord) and consolidate URL equity to a single
         canonical URL (avoids / vs /home duplicate-content issue).
         Override per-route if needed (e.g. different og:title on
         /about vs /home) by mutating these meta tags at runtime. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="101 Drivers" />
    <meta property="og:title" content="101 Drivers - Vehicle Delivery Service" />
    <meta property="og:description" content="California's premier vehicle delivery service for dealers. Track deliveries, manage fleet movements, and get real-time updates." />
    <meta property="og:url" content="https://101drivers.com/home" />
    <meta property="og:image" content="https://101drivers.com/assets/101drivers-logo.jpg" />
    <meta property="og:image:alt" content="101 Drivers logo" />
    <meta property="og:image:width" content="400" />
    <meta property="og:image:height" content="400" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="101 Drivers - Vehicle Delivery Service" />
    <meta name="twitter:description" content="California's premier vehicle delivery service for dealers." />
    <meta name="twitter:image" content="https://101drivers.com/assets/101drivers-logo.jpg" />
    <link rel="canonical" href="https://101drivers.com/home" />

    <!-- ── Performance: preconnect to third-party origins ──
         Saves 1 DNS lookup + 1 TLS handshake (~100-300ms each) on the
         first request to each origin. Order matters: preconnect before
         the actual resource request (fonts/maps/stripe) appears. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://maps.googleapis.com" />
    <link rel="preconnect" href="https://js.stripe.com" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    
    <!-- iOS Safe Area -->
    <style>
      html {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      body {
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    </style>
    
    <!-- Preload critical assets -->
    <link rel="preload" href="/assets/101drivers-logo.jpg" as="image" />

    <!-- Render-blocking CSS: sets background/color before first paint.
         color-scheme tells the browser to render native elements (scrollbars,
         inputs, selection) in the correct theme immediately. -->
    <style>
      :root {
        color-scheme: light;
        background-color: #ffffff;
        color: #020617;
      }
      .dark {
        color-scheme: dark;
        background-color: #0f172a;
        color: #f8fafc;
      }
    </style>

    <!-- Inline script: reads localStorage and sets the 'dark' class
         on <html> before React loads. The <style> above handles the rest. -->
    <script>
      (function() {
        var t = localStorage.getItem('theme');
        if (t === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register Service Worker (production only) -->
    <script>
      if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
