    <!-- Render-blocking CSS: sets background/color before first paint.
         color-scheme tells the browser to render native elements (scrollbars,
         inputs, selection) in the correct theme immediately. -->
    <style>
      :root {
        color-scheme: light;
        background-color: #ffffff;

      }
    </style>

    <!-- Inline script: reads localStorage and sets the 'dark' class
         on <html> before React loads. The <style> above handles the rest. -->
    <script>
      (function() {
        var t = localStorage.getItem('theme');
        if (t === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
