    <!-- ── Pre-React recovery listeners ──
         These run BEFORE the bundle so they work even when the entry
         module itself fails to load (the vite:preloadError handler inside
         main.tsx only exists once the bundle has booted). Both share the
         same 30s reload guard key as RouteErrorScreen so no code path can
         loop reloads. -->
    <script>
      (function () {
        var RELOAD_KEY = 'route-error:auto-reload-at';
        function reloadOnce() {
          try {
            var last = Number(sessionStorage.getItem(RELOAD_KEY) || 0);
            if (Date.now() - last < 30000) return false;
            sessionStorage.setItem(RELOAD_KEY, String(Date.now()));
          } catch (e) { /* private mode — still reload */ }
          location.reload();
          return true;
        }

        // A lazy chunk / preload failed before React could listen.
        window.addEventListener('vite:preloadError', function (e) {
          e.preventDefault();
          reloadOnce();
        });

        // Entry/asset script element failed to LOAD (404 after a deploy
        // swapped hashed files, SPA-fallback HTML served as JS, ...).
        // Capture phase catches script errors that happen before any
        // window.onerror inside the bundle is registered. Only app
        // assets trigger recovery — a random broken <img> must not.
        window.addEventListener('error', function (ev) {
          var t = ev.target;
          if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
          var url = String(t.src || t.href || '');
          if (url.indexOf('/assets/') !== -1 || url.indexOf('/src/') !== -1) {
            reloadOnce();
          }
        }, true);

        // Watchdogs: if React never takes over, escalate recovery.
        setTimeout(function () {
          if (window.__APP_BOOTED__) return;
          var el = document.getElementById('boot-slow');
          if (el) el.style.display = 'block';
        }, 8000);
        setTimeout(function () {
          if (window.__APP_BOOTED__) return;
          var el = document.getElementById('boot-stuck');
          if (el) el.style.display = 'block';
          var btn = document.getElementById('boot-clear-btn');
          if (btn && !btn.dataset.wired) {
            btn.dataset.wired = '1';
            btn.addEventListener('click', function () {
              // The nuclear option for a poisoned installed PWA: drop the
              // service worker and EVERY cache bucket (stale chunks live
              // there) but keep localStorage — sign-in state survives.
              var done = function () { location.reload(); };
              try {
                var regs = navigator.serviceWorker
                  ? navigator.serviceWorker.getRegistrations()
                  : Promise.resolve([]);
                regs
                  .then(function (rs) {
                    return Promise.all(rs.map(function (r) { return r.unregister(); }));
                  })
                  .then(function () { return caches.keys(); })
                  .then(function (keys) {
                    return Promise.all((keys || []).map(function (k) { return caches.delete(k); }));
                  })
                  .catch(function () {})
                  .then(done, done);
              } catch (e) { done(); }
            });
          }
        }, 20000);
      })();
    </script>
